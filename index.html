<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Único index.html do projeto: cada "página" é um componente React (src/pages/).
         O título de cada página é definido no próprio componente, com <title>.
         O bloco marcado "seo" logo abaixo é trocado no build por rota (ver vite.config.js e src/data/seo.js). -->
    <!--seo-->
    <title>PKZ Lab, One To One e Fisioterapia | Barra da Tijuca, RJ</title>
    <meta
      name="description"
      content="PKZ Lab (treino de alto rendimento), Studio One To One (personal training e nutrição) e Fisioterapia no mesmo endereço, na Barra da Tijuca, Rio de Janeiro."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <!--/seo-->
    <link rel="icon" href="%BASE_URL%assets/icons/favicon.svg" type="image/svg+xml" />
    <!-- Fontes das três identidades: portal (Barlow Condensed), PKZ (Montserrat) e One To One (Plus Jakarta Sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,900;1,900&family=Inter:wght@400;500;600;700&family=Montserrat:ital,wght@0,700;0,800;0,900;1,600;1,900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
